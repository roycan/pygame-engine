name: pages

# Deploys the STATIC slide decks in slides/ to GitHub Pages.
#
# The Flask app itself stays on Render (in-memory GAMES, gunicorn --workers 1);
# Pages serves ONLY the decks. Both host from the SAME repo, so new decks
# committed under slides/ go live with zero copying and zero second repo.
#
# One-time manual step (repo owner): Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # manual re-deploy, e.g. after a Pages settings change

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides
      - id: deployment
        uses: actions/deploy-pages@v4
